line-length = 79
target-version = "py312"

[lint]
select = ["E", "W", "F", "I", "UP"]

[lint.isort]
known-first-party = [
  "app.domain",
  "app.application",
  "app.infrastructure",
  "app.api",
]
known-third-party = [
  "playwright",
  "genai",
  "fastapi",
  "google",
  "jwt",
]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder"
]
